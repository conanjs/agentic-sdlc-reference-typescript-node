# Runs the reference's own checks, then the Agentic SDLC project validator from the framework repo,
# pinned to a framework commit (a tag can move; a full SHA cannot). Bump FRAMEWORK_REF when the
# framework's rules change.
name: check
on:
  push:
    branches: [main, "layout/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      framework-ref:
        description: agent-config commit or branch to validate against
        required: false
env:
  FRAMEWORK_REF: ${{ inputs.framework-ref || '796b2623dfad96e0c048c767f82d2d3b4dbccaef' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Follows the typescript-node stack's CI template (stacks/typescript-node/index.md); actions pinned by full SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile # cmd.install; pnpm version from packageManager
      - run: pnpm run check # format, lint, typecheck, unit, integration, build, smoke
      - run: pnpm audit --audit-level high # cmd.audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conanjs/agent-config
          ref: ${{ env.FRAMEWORK_REF }}
          path: .agent-config
          sparse-checkout: |
            copilot/frameworks/agentic-sdlc
            copilot/procedures
      - name: Validate against the framework
        run: node .agent-config/copilot/frameworks/agentic-sdlc/tools/validate-project.mjs . --framework .agent-config/copilot/frameworks/agentic-sdlc --procedures .agent-config/copilot/procedures
